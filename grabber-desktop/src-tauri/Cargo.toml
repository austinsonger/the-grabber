[package]
name = "grabber-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "grabber_desktop"
path = "src/lib.rs"

[[bin]]
name = "grabber-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
the-grabber = { path = "../.." }
