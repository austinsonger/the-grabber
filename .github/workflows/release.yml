name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.1.0)"
        required: true
        type: string
      publish:
        description: "Create/attach to the GitHub release (uncheck for a dry-run build)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate version input
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' must match vX.Y.Z (e.g. v1.1.0)"
            exit 1
          fi

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          staging="grabber-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/grabber" "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grabber-${{ matrix.target }}
          path: grabber-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-desktop:
    name: Build desktop (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux bundler dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: desktop-${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: grabber-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: grabber-desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: grabber-desktop
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Stage bundles
        shell: bash
        run: |
          set -euo pipefail
          staging="grabber-desktop-${{ matrix.target }}"
          mkdir -p "$staging"
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          # Collect whatever installers this platform produced.
          find "$bundle_dir" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} "$staging/" \;
          ls -la "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grabber-desktop-${{ matrix.target }}
          path: grabber-desktop-${{ matrix.target }}/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-cli, build-desktop]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check release/tag state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: grabber-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            gh release upload "$VERSION" --repo "${{ github.repository }}" --clobber dist/*
          elif [ "${TAG_EXISTS}" = "true" ]; then
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$VERSION" \
              --generate-notes \
              dist/*
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$VERSION" \
              --generate-notes \
              dist/*
          fi
